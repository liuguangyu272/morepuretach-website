server {
    listen 80 default_server;
    server_name 113.44.83.197 morepuretech.com www.morepuretech.com;
    server_tokens off;
    client_max_body_size 7m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = /admin { return 308 https://admin.morepuretech.com/admin; }
    location ^~ /admin/ { return 308 https://admin.morepuretech.com$request_uri; }
    location ^~ /api/admin { return 404; }
    location / { include /etc/nginx/snippets/morepure-proxy.conf; }
}
server {
    listen 80;
    server_name admin.morepuretech.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
