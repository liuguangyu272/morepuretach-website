server {
    listen 80 default_server;
    server_name morepuretech.com www.morepuretech.com admin.morepuretech.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name morepuretech.com www.morepuretech.com;
    ssl_certificate /etc/letsencrypt/live/morepuretech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/morepuretech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 7m;
    add_header X-Content-Type-Options nosniff always;
    location = /admin { return 308 https://admin.morepuretech.com/admin; }
    location ^~ /admin/ { return 308 https://admin.morepuretech.com$request_uri; }
    location ^~ /api/admin { return 404; }
    location / { include /etc/nginx/snippets/morepure-proxy.conf; }
}
server {
    listen 443 ssl;
    server_name admin.morepuretech.com;
    ssl_certificate /etc/letsencrypt/live/morepuretech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/morepuretech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 7m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location = / { return 302 /admin; }
    location / { include /etc/nginx/snippets/morepure-proxy.conf; }
}
